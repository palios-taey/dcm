# r5-audit-gate — MECHANICAL enforcement of the R5 adversarial-audit gate.
#
# Why this exists: the audit gate used to be a process convention ("don't merge
# until both auditors ENDORSE"). A convention is not a gate — a merge raced it
# (orchestrator #55, 2026-06-11). This makes it structural: a PR that touches a
# risky surface (.github/r5-risky-paths) CANNOT merge until BOTH adversarial
# auditors post a `success` commit status (audit/grok + audit/gatekeeper) on the
# PR head SHA. GitHub branch protection requires the `r5-audit-gate` context this
# workflow sets, so no human discipline is involved.
#
# Known limitation (Gatekeeper PR#57, non-blocking): this verifies the status
# CONTEXT + STATE, not WHO posted it — anyone with statuses:write could forge an
# auditor success. That is inherent to commit-status gates and bounded by repo
# write access + branch protection (the fleet is a single trusted account). A
# future hardening could verify the status creator / require signed verdicts.
#
# Auditors post their verdict (on ENDORSE / BLOCK) with:
#   gh api repos/$REPO/statuses/$SHA -f state=success -f context=audit/grok \
#     -f description="ENDORSE" -f target_url=<verdict-log-url>
# (state=failure on BLOCK). The gate re-evaluates on every status event.
name: r5-audit-gate

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  status: {}

permissions:
  checks: write
  contents: read
  statuses: write
  pull-requests: read

jobs:
  gate:
    name: r5-audit-visible
    runs-on: ubuntu-latest
    # Skip self-triggers: this workflow SETS the r5-audit-gate status, which is
    # itself a status event — without this guard it would loop forever. Only
    # react to the auditors' statuses (audit/*) and to pull_request events.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'status' && github.event.context != 'r5-audit-gate')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Evaluate R5 audit gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Resolve one exact PR head before any status write.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            HEAD_SHA="${{ github.event.sha }}"
          fi

          sync_visible_check() {  # state
            if [ "${{ github.event_name }}" != "status" ]; then
              return 0
            fi
            if ! check_runs="$(gh api \
                 "repos/$REPO/commits/$HEAD_SHA/check-runs?check_name=r5-audit-visible&filter=latest&per_page=100")" ||
               ! visible_checks="$(echo "$check_runs" | jq -c --arg head "$HEAD_SHA" \
                 '[.check_runs[] | select(.name == "r5-audit-visible" and .head_sha == $head and .app.slug == "github-actions")]')" ||
               ! visible_count="$(echo "$visible_checks" | jq 'length')"; then
              echo "unable to resolve the PR-head visible check" >&2
              return 1
            fi
            if [ "$visible_count" -ne 1 ]; then
              echo "refusing visible-check update: expected one PR-head check, found $visible_count" >&2
              return 1
            fi
            if ! visible_id="$(echo "$visible_checks" | jq -r '.[0].id')" ||
               [[ ! "$visible_id" =~ ^[0-9]+$ ]]; then
              echo "invalid PR-head visible check id" >&2
              return 1
            fi
            if [ "$1" = "pending" ]; then
              if ! gh api -X PATCH "repos/$REPO/check-runs/$visible_id" \
                   -f status=in_progress >/dev/null; then
                echo "unable to mark the PR-head visible check in progress" >&2
                return 1
              fi
            else
              if ! gh api -X PATCH "repos/$REPO/check-runs/$visible_id" \
                   -f status=completed -f conclusion="$1" >/dev/null; then
                echo "unable to complete the PR-head visible check" >&2
                return 1
              fi
            fi
            echo "r5-audit-visible -> $1 on $HEAD_SHA"
          }

          set_status() {  # state, description
            if [[ ! "${PR_NUM:-}" =~ ^[0-9]+$ ]]; then
              echo "refusing status write without a bound PR" >&2
              return 1
            fi
            if ! live_prs="$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls?per_page=100")" ||
               ! live_open="$(echo "$live_prs" | jq -c --arg head "$HEAD_SHA" \
                 '[.[] | select(.state == "open" and .head.sha == $head)]')" ||
               ! live_count="$(echo "$live_open" | jq 'length')"; then
              echo "refusing status write: current open PR binding is unresolved" >&2
              return 1
            fi
            if [ "$live_count" -eq 0 ]; then
              echo "refusing status write: no PR is open at $HEAD_SHA" >&2
              return 1
            fi
            if [ "$live_count" -ne 1 ]; then
              gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" \
                -f state=failure -f context="r5-audit-gate" \
                -f description="R5 gate error: ambiguous open PR binding" >/dev/null
              echo "r5-audit-gate -> failure (ambiguous open PR binding)"
              return 1
            fi
            if [ "$(echo "$live_open" | jq -r '.[0].number')" != "$PR_NUM" ]; then
              echo "refusing status write: bound PR changed for $HEAD_SHA" >&2
              return 1
            fi
            if ! gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" \
                 -f state="$1" -f context="r5-audit-gate" -f description="$2" >/dev/null; then
              echo "unable to write r5-audit-gate status" >&2
              return 1
            fi
            if ! sync_visible_check "$1"; then
              if ! gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" \
                   -f state=failure -f context="r5-audit-gate" \
                   -f description="R5 gate error: visible check update failed" >/dev/null; then
                echo "unable to fail r5-audit-gate after visible-check update failure" >&2
              fi
              return 1
            fi
            echo "r5-audit-gate -> $1 ($2)"
          }

          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid head SHA from event: $HEAD_SHA" >&2
            exit 1
          fi

          # Bind both event paths to a current open PR object at the exact head.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUM="${{ github.event.pull_request.number }}"
            if [[ ! "$PR_NUM" =~ ^[0-9]+$ ]] ||
               ! PR_JSON="$(gh api "repos/$REPO/pulls/$PR_NUM")"; then
              echo "unable to resolve pull-request event binding" >&2
              exit 1
            fi
            if ! BOUND_PR="$(echo "$PR_JSON" | jq -c --arg head "$HEAD_SHA" \
              'select(.state == "open" and .head.sha == $head)')"; then
              echo "invalid pull-request event binding response" >&2
              exit 1
            fi
            if [ -z "$BOUND_PR" ]; then
              echo "PR #$PR_NUM is no longer open at $HEAD_SHA — no status write."
              exit 0
            fi
          else
            if ! PR_JSON="$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls?per_page=100")"; then
              echo "unable to resolve an open PR binding for $HEAD_SHA" >&2
              exit 1
            fi
            if ! OPEN_PRS="$(echo "$PR_JSON" | jq -c --arg head "$HEAD_SHA" \
              '[.[] | select(.state == "open" and .head.sha == $head)]')" ||
               ! PR_COUNT="$(echo "$OPEN_PRS" | jq 'length')"; then
              echo "invalid PR binding response for $HEAD_SHA" >&2
              exit 1
            fi
            if [ "$PR_COUNT" -eq 0 ]; then
              echo "status event for $HEAD_SHA maps to no open PR — preserving existing status."
              exit 0
            fi
            if [ "$PR_COUNT" -ne 1 ]; then
              if ! PR_NUM="$(echo "$OPEN_PRS" | jq -r '.[0].number')"; then
                echo "invalid ambiguous PR binding response for $HEAD_SHA" >&2
                exit 1
              fi
              set_status failure "R5 gate error: ambiguous open PR binding"
              exit 1
            fi
            if ! BOUND_PR="$(echo "$OPEN_PRS" | jq -c '.[0]')"; then
              echo "invalid exact PR binding response for $HEAD_SHA" >&2
              exit 1
            fi
          fi

          if ! PR_NUM="$(echo "$BOUND_PR" | jq -r '.number')" ||
             [[ ! "$PR_NUM" =~ ^[0-9]+$ ]]; then
            echo "invalid bound PR number for $HEAD_SHA" >&2
            exit 1
          fi
          if ! BASE_REF="$(echo "$BOUND_PR" | jq -r '.base.ref')" ||
             ! BASE_SHA="$(echo "$BOUND_PR" | jq -r '.base.sha')" ||
             [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [ -z "$BASE_REF" ]; then
            set_status failure "R5 gate error: invalid immutable PR binding"
            exit 1
          fi
          echo "PR #$PR_NUM head=$HEAD_SHA base=$BASE_REF base_sha=$BASE_SHA"
          set_status pending "R5 gate evaluating immutable PR fork"

          if ! git fetch -q origin "$BASE_SHA"; then
            set_status failure "R5 gate error: unable to fetch exact PR base"
            exit 1
          fi
          if [ "$(git rev-parse FETCH_HEAD)" != "$BASE_SHA" ]; then
            set_status failure "R5 gate error: fetched PR base does not match binding"
            exit 1
          fi
          if ! git fetch -q origin "pull/$PR_NUM/head"; then
            set_status failure "R5 gate error: unable to fetch PR head"
            exit 1
          fi
          if [ "$(git rev-parse FETCH_HEAD)" != "$HEAD_SHA" ] ||
             ! git cat-file -e "${BASE_SHA}^{commit}" ||
             ! git cat-file -e "${HEAD_SHA}^{commit}"; then
            set_status failure "R5 gate error: PR binding changed during evaluation"
            exit 1
          fi

          if git merge-base --is-ancestor "$HEAD_SHA" "$BASE_SHA"; then
            set_status failure "R5 gate error: open PR head is already contained in base"
            exit 1
          else
            ancestor_rc="$?"
            if [ "$ancestor_rc" -ne 1 ]; then
              set_status failure "R5 gate error: unable to verify PR ancestry"
              exit 1
            fi
          fi

          if ! FORK_SHA="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"; then
            set_status failure "R5 gate error: unable to resolve immutable PR fork"
            exit 1
          fi
          if [[ ! "$FORK_SHA" =~ ^[0-9a-f]{40}$ ]] || [ "$FORK_SHA" = "$HEAD_SHA" ]; then
            set_status failure "R5 gate error: invalid immutable PR fork"
            exit 1
          fi
          echo "PR #$PR_NUM fork=$FORK_SHA head=$HEAD_SHA"

          if ! python3 scripts/r5-risk-classifier "$FORK_SHA" "$HEAD_SHA" \
               --risk-paths .github/r5-risky-paths | tee /tmp/r5-risk.txt; then
            set_status failure "R5 gate error: classifier execution failed"
            exit 1
          fi
          RISKY="$(awk -F= '$1 == "RISKY" {print $2}' /tmp/r5-risk.txt | tail -n 1)"
          if [[ ! "$RISKY" =~ ^[01]$ ]]; then
            set_status failure "R5 gate error: classifier produced no verdict"
            exit 1
          fi

          if ! STATUSES="$(gh api "repos/$REPO/commits/$HEAD_SHA/status")"; then
            set_status failure "R5 gate error: unable to read audit statuses"
            exit 1
          fi
          if ! grok_state="$(echo "$STATUSES" | jq -r '[.statuses[] | select(.context=="audit/grok")] | .[0].state // "missing"')" ||
             ! gk_state="$(echo "$STATUSES" | jq -r '[.statuses[] | select(.context=="audit/gatekeeper")] | .[0].state // "missing"')"; then
            set_status failure "R5 gate error: invalid audit status response"
            exit 1
          fi
          echo "audit/grok=$grok_state audit/gatekeeper=$gk_state"

          if [ "$RISKY" -eq 0 ]; then
            if [ "$grok_state" = "success" ] && [ "$gk_state" = "success" ]; then
              set_status success "R5 ENDORSED: grok + gatekeeper"
            else
              set_status success "no R5 risky surface touched"
            fi
            exit 0
          fi

          # Risky: require BOTH auditor statuses = success on HEAD_SHA.
          if [ "$grok_state" = "success" ] && [ "$gk_state" = "success" ]; then
            set_status success "R5 ENDORSED: grok + gatekeeper"
          else
            set_status failure "R5 required: grok=$grok_state gatekeeper=$gk_state (both must be success)"
            exit 1
          fi
