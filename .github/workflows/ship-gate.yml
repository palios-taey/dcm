# Ship-gate CI — the merge gate required by main's branch protection (context: ship-gate-acceptance).
#
# Runs clean-checkout package installation, AI-native documentation coherence verification,
# and exercises the real DCM substrate against an ephemeral Neo4j instance with scoped cleanup.

name: ship-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "release/**"]
  workflow_dispatch:

jobs:
  ship-gate-acceptance:           # <- required status-check context on main
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: none
        ports:
          - 7687:7687
    env:
      DCM_NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_AUTH: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package from clean checkout
        run: pip install -e . -r requirements.txt
      - name: Verify documentation coherence
        run: python3 docs_coherence_check.py
      - name: Execute DCM substrate validation against Neo4j
        run: python3 validate_substrate.py
